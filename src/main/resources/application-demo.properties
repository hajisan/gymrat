# =========================================
# DEMO PROFILE - H2 in-memory, mock data
# =========================================

server.port=8081

# =========================================
# AUTHENTICATION - demo user
# =========================================
app.auth.username=demo
app.auth.password=gymrat

# =========================================
# DATABASE - H2 in-memory
# =========================================
spring.datasource.url=jdbc:h2:mem:gymrat_demo;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# =========================================
# JPA - let Hibernate create schema
# =========================================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================
# DATA INITIALIZATION
# =========================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data-demo.sql
spring.jpa.defer-datasource-initialization=true

# =========================================
# CORS - allow nimasalami.dk to iframe
# =========================================
cors.allowed-origins=https://www.nimasalami.dk,https://nimasalami.dk,http://localhost:4321,https://gym.nimasalami.dk

# =========================================
# SECURITY
# =========================================
app.remember-me.key=gymrat-demo-remember-me-key
spring.h2.console.enabled=false

# =========================================
# COOKIES - SameSite=None for cross-origin iframe
# =========================================
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# =========================================
# LOGGING - quieter for demo
# =========================================
logging.level.root=WARN
logging.level.com.example.gymrat_backend=INFO
