# =========================================
# PRODUCTION PROFILE
# =========================================

# =========================================
# PROD DATABASE CONFIGURATION
# =========================================
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA CONFIGURATION (PROD)
# =========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================
# DATA INITIALIZATION (PROD)
# =========================================
spring.sql.init.mode=never

# =========================================
# SECURITY
# =========================================
app.remember-me.key=${REMEMBER_ME_KEY}

# =========================================
# LOGGING (PROD)
# =========================================
logging.level.root=WARN
logging.level.com.example.gymrat_backend=INFO
logging.level.org.hibernate.SQL=WARN

# =========================================
# ERROR HANDLING (PROD - mindre info udadtil)
# =========================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# =========================================
# CONNECTION POOL (PROD - optimeret til 1GB RAM)
# =========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.pool-name=GymRatHikariPool

# =========================================
# HTTP COMPRESSION (GZIP)
# =========================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# =========================================
# SERVER TUNING
# =========================================
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100
server.tomcat.max-connections=200

# =========================================
# SPRING CACHE
# =========================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# =========================================
# PROXY - trust X-Forwarded-Proto from nginx
# =========================================
server.forward-headers-strategy=native

# =========================================
# CORS CONFIGURATION (PROD)
# =========================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# =========================================
# AUTHENTICATION (PROD - via miljøvariabler)
# =========================================
app.auth.username=${AUTH_USERNAME}
app.auth.password=${AUTH_PASSWORD}